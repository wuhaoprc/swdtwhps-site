<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>江河海 · 海水淡化全流程 3D 模拟系统</title>
  <meta name="description" content="江河海 SWRO 海水淡化全流程三维可视化：取水、预处理、超滤、高压与能量回收、反渗透、后处理、浓水排放七段工艺逐段建模，支持截图、动画与 3D 模型导出。" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="江河海 · 海水淡化全流程 3D 模拟系统" />
  <meta property="og:title" content="江河海 · 海水淡化全流程 3D 模拟系统" />
  <meta property="og:description" content="七段工艺三维可视化模拟，可截图、录屏与导出 3D 模型。" />
  <meta property="og:url" content="https://swdtwhps.dpdns.org/" />
  <meta name="twitter:card" content="summary" />
  <!-- 离线本地化 three.js：所有 js 由 ./vendor 提供，无需联网，且不依赖 Import Maps，
       用相对路径直接解析，兼容性更强（旧版 WebView 也能运行）。 -->
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(12, 22, 38, 0.86);
      --line: rgba(120, 170, 220, 0.22);
      --accent: #2ea8ff;
      --accent2: #39d98a;
      --text: #dfe8f5;
      --muted: #8aa0bd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      /* 滚动条与深色背景统一：细窄、低对比轨道、主题蓝滑块 */
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 170, 220, .34) rgba(120, 170, 220, .06); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(120, 170, 220, .06); border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 170, 220, .34); border-radius: 8px;
      border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(46, 168, 255, .5); background-clip: padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }
    /* 水印覆盖层：实时叠加在 3D 画面之上。
       canvas 是替换元素，只写 inset:0 不会把 CSS 尺寸拉到容器宽度，
       在高分屏（dpr≥2）上会按位图尺寸（如 2880×1800）铺开，导致水印跑到视口外，
       必须显式给 width/height 100%。 */
    #wm-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    #panel {
      position: fixed; top: 14px; left: 14px; width: 264px; max-height: calc(100vh - 28px);
      overflow: auto; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px; backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0,0,0,.4); z-index: 10;
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 170, 220, .34) rgba(120, 170, 220, .06);
    }
    #panel h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .5px; }
    #panel .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .grp { font-size: 11px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
    .seg-btn {
      display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px;
      background: rgba(40, 70, 110, .35); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; cursor: pointer; font-size: 13px; transition: .15s;
    }
    .seg-btn:hover { background: rgba(46, 168, 255, .22); }
    .seg-btn.active { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 700; }
    .seg-btn small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .seg-btn.active small { color: #06243a; }
    .ex-btn {
      display: inline-block; width: calc(50% - 4px); margin: 3px 2px; padding: 8px 0; text-align: center;
      background: rgba(57, 217, 138, .14); border: 1px solid rgba(57,217,138,.4); color: var(--accent2);
      border-radius: 8px; cursor: pointer; font-size: 12px;
    }
    .ex-btn:hover { background: rgba(57, 217, 138, .28); }
    .ex-btn.wide { width: calc(100% - 4px); }

    #hud {
      position: fixed; top: 14px; right: 14px; width: 380px; max-width: calc(100vw - 28px);
      max-height: calc(100vh - 72px); overflow: auto; /* 底部留出提示条空间 */
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 170, 220, .34) rgba(120, 170, 220, .06);
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; backdrop-filter: blur(6px); z-index: 10;
    }
    /* 顶部居中主标题：海水淡化全流程工艺（SWRO）固定正上方居中 */
    #title-bar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 26px; backdrop-filter: blur(6px); z-index: 11;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
      white-space: nowrap; max-width: calc(100vw - 704px); overflow: hidden; text-overflow: ellipsis;
    }
    #title-bar .t-main { font-size: 17px; font-weight: 700; letter-spacing: 1px; color: #fff; }
    #title-bar .t-sub { font-size: 13px; font-weight: 700; color: var(--accent); margin-left: 8px; }
    #hud .name { font-size: 16px; font-weight: 700; color: #fff; }
    #hud .sub2 { font-size: 12px; color: var(--accent); margin: 2px 0 8px; }
    #hud .desc { font-size: 12px; color: var(--text); line-height: 1.6; }
    #hud table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12px; }
    #hud td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
    #hud td.k { color: var(--muted); width: 42%; }
    #hud td.v { color: var(--text); }

    #hint { position: fixed; bottom: 14px; right: 14px; font-size: 11px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; z-index: 10; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--muted); font-size: 14px; z-index: 50; }

    /* ===== 移动端（≤1200px：手机 + 平板，含横屏）：两侧介绍框默认收起，点击唤出 ===== */
    .tab-btn { display: none; }
    #scrim { display: none; }
    @media (max-width: 1200px) {
      #title-bar { top: 8px; max-width: calc(100vw - 24px); padding: 8px 14px; }
      #title-bar .t-main { font-size: 14px; letter-spacing: .5px; }
      #title-bar .t-sub { font-size: 11px; margin-left: 6px; }
      #hint { display: none; }

      /* 收起态：整体移出视口，不接收点击，也不遮挡 3D 画面 */
      #panel, #hud {
        top: 58px; /* 让开顶部标题栏，避免面板抬头被压住 */
        max-height: calc(100vh - 128px);
        overflow: auto; -webkit-overflow-scrolling: touch;
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: transform .26s ease, opacity .18s ease;
        overscroll-behavior: contain;
      }
      #panel { left: 8px; width: min(86vw, 320px); transform: translateX(-108%); }
      #hud { right: 8px; width: min(92vw, 360px); transform: translateX(108%); }

      body[data-open="panel"] #panel,
      body[data-open="hud"] #hud {
        opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0);
      }
      body[data-open] #scrim {
        display: block; position: fixed; inset: 0; z-index: 9;
        background: rgba(4, 10, 20, .48);
      }

      .tab-btn {
        display: inline-flex; align-items: center; gap: 6px;
        position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 13;
        background: var(--panel); border: 1px solid var(--line); color: var(--text);
        border-radius: 999px; padding: 9px 16px; font-size: 13px; font-family: inherit;
        backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .tab-btn:active { background: rgba(46, 168, 255, .22); }
      #tab-panel { left: 12px; }
      #tab-hud { right: 12px; }
      .tab-btn[aria-expanded="true"] { background: var(--accent); color: #04121f;
        border-color: var(--accent); font-weight: 700; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- three.js 渲染画布由 JS 动态插入；水印覆盖层如下 -->
    <canvas id="wm-canvas"></canvas>
  </div>

  <div id="panel">
    <h1>江河海 · 海水淡化 3D 模拟</h1>
    <div class="sub">SWRO 全流程 · 按工艺段拆分</div>
    <div class="grp">工艺段（点击切换）</div>
    <div id="seg-list"></div>
    <div class="grp">导出（自动加盖 JHH 水印）</div>
    <div id="ex-list"></div>
  </div>

  <div id="hud">
    <div class="name" id="hud-name">—</div>
    <div class="sub2" id="hud-sub">—</div>
    <div class="desc" id="hud-desc">—</div>
    <table id="hud-params"><tbody></tbody></table>
  </div>

  <div id="title-bar">
    <span class="t-main">海水淡化全流程工艺</span><span class="t-sub">（SWRO）</span>
  </div>

  <div id="hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移 · 可开启「自动巡游」</div>

  <!-- 移动端唤出按钮：窄屏下两侧介绍框默认收起，避免遮挡 3D 主画面 -->
  <button id="tab-panel" class="tab-btn" type="button" aria-expanded="false" aria-controls="panel">工艺段</button>
  <button id="tab-hud" class="tab-btn" type="button" aria-expanded="false" aria-controls="hud">参数说明</button>
  <div id="scrim"></div>

  <div id="loading">正在加载 3D 场景…（首次需初始化 three.js）</div>

  <script>
    (function () {
      var body = document.body;
      var tp = document.getElementById('tab-panel');
      var th = document.getElementById('tab-hud');
      var scrim = document.getElementById('scrim');
      var mq = window.matchMedia('(max-width: 1200px)');

      function setOpen(name) {
        if (name) { body.setAttribute('data-open', name); } else { body.removeAttribute('data-open'); }
        var pOpen = name === 'panel', hOpen = name === 'hud';
        tp.setAttribute('aria-expanded', pOpen ? 'true' : 'false');
        th.setAttribute('aria-expanded', hOpen ? 'true' : 'false');
        tp.textContent = pOpen ? '收起工艺段' : '工艺段';
        th.textContent = hOpen ? '收起参数' : '参数说明';
      }
      function toggle(name) {
        setOpen(body.getAttribute('data-open') === name ? '' : name);
      }

      tp.addEventListener('click', function () { toggle('panel'); });
      th.addEventListener('click', function () { toggle('hud'); });
      scrim.addEventListener('click', function () { setOpen(''); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { setOpen(''); }
      });
      // 切到宽屏（桌面）时清空展开状态，避免透明遮罩残留
      if (mq.addEventListener) {
        mq.addEventListener('change', function (e) { if (!e.matches) { setOpen(''); } });
      }

      // 打开页面即收起：窄屏默认隐藏两侧介绍框
      setOpen('');
    })();
  </script>

  <!-- 安全网：若模块加载/初始化失败（如 WebGL 不可用、静态服务器未正常提供文件），
       4 秒后仍未初始化成功则给出可定位的诊断提示，而不是无限卡在"正在加载"。 -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var l = document.getElementById('loading');
        if (l && !window.__desalApp) {
          l.textContent =
            '⚠ 场景加载超时：three.js 未能完成初始化。\n（本系统不依赖 Import Maps，采用纯相对路径加载，Chrome/Edge/Firefox/Safari 均可运行）\n\n可能原因与排查：\n' +
            '1) 当前环境不支持 WebGL —— 请确认浏览器已开启硬件加速 / WebGL（Safari 需在设置或"开发"菜单中启用）；\n' +
            '2) 静态服务器未正常提供 ./vendor 与 ./src 文件 —— 确认 npm start 已启动且端口 5173 可访问；\n' +
            '3) 模块解析 / 网络错误 —— 按 F12 打开控制台查看红色报错。';
          l.style.color = '#ff9a9a';
          l.style.whiteSpace = 'pre-wrap';
          l.style.padding = '24px';
          l.style.textAlign = 'left';
          l.style.fontSize = '14px';
        }
      }, 4000);
    });
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
